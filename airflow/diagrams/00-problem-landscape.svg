<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <linearGradient id="bg00" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arr00" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="460" fill="url(#bg00)"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">工作流编排工具光谱 (Workflow Orchestration Landscape)</text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#475569">从单机定时任务到流式计算，Airflow 在何处？</text>

  <!-- horizontal axis -->
  <line x1="60" y1="240" x2="1040" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr00)"/>
  <text x="65" y="265" font-size="11" fill="#64748b">简单 / 单机</text>
  <text x="1035" y="265" text-anchor="end" font-size="11" fill="#64748b">复杂 / 分布式 / 数据驱动</text>

  <!-- vertical axis -->
  <line x1="60" y1="380" x2="60" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr00)"/>
  <text x="50" y="105" font-size="11" fill="#64748b" text-anchor="end">高动态性</text>
  <text x="50" y="375" font-size="11" fill="#64748b" text-anchor="end">静态调度</text>

  <!-- cron -->
  <g>
    <rect x="100" y="290" width="120" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="316" text-anchor="middle" font-weight="700" fill="#92400e">cron / systemd</text>
    <text x="160" y="334" text-anchor="middle" font-size="10" fill="#78350f">无依赖、无重试、无 UI</text>
  </g>

  <!-- Luigi -->
  <g>
    <rect x="250" y="260" width="120" height="60" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="310" y="286" text-anchor="middle" font-weight="700" fill="#78350f">Luigi (Spotify)</text>
    <text x="310" y="304" text-anchor="middle" font-size="10" fill="#78350f">Task 依赖 + 输出</text>
    <text x="310" y="316" text-anchor="middle" font-size="10" fill="#78350f">无中心调度器</text>
  </g>

  <!-- Airflow (highlighted) -->
  <g>
    <rect x="420" y="170" width="180" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="510" y="196" text-anchor="middle" font-weight="800" fill="#1e3a8a" font-size="15">Apache Airflow</text>
    <text x="510" y="216" text-anchor="middle" font-size="11" fill="#1e40af">DAG-as-code (Python)</text>
    <text x="510" y="232" text-anchor="middle" font-size="11" fill="#1e40af">中心 Scheduler + Worker</text>
    <text x="510" y="248" text-anchor="middle" font-size="11" fill="#1e40af">序列化 DAG / Execution API</text>
    <text x="510" y="264" text-anchor="middle" font-size="11" fill="#1e40af">100+ Provider 生态</text>
    <text x="510" y="280" text-anchor="middle" font-size="11" fill="#1e40af">Deferrable + Asset 驱动</text>
    <text x="510" y="298" text-anchor="middle" font-size="10" fill="#1d4ed8" font-style="italic">"程序化定义、调度、监控工作流"</text>
  </g>

  <!-- Prefect -->
  <g>
    <rect x="640" y="220" width="120" height="60" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="700" y="246" text-anchor="middle" font-weight="700" fill="#9d174d">Prefect</text>
    <text x="700" y="264" text-anchor="middle" font-size="10" fill="#831843">函数式 dataflow</text>
    <text x="700" y="276" text-anchor="middle" font-size="10" fill="#831843">动态优先</text>
  </g>

  <!-- Dagster -->
  <g>
    <rect x="780" y="190" width="130" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="845" y="216" text-anchor="middle" font-weight="700" fill="#5b21b6">Dagster</text>
    <text x="845" y="234" text-anchor="middle" font-size="10" fill="#4c1d95">Software-defined Asset</text>
    <text x="845" y="246" text-anchor="middle" font-size="10" fill="#4c1d95">类型系统 / Op-Graph</text>
    <text x="845" y="258" text-anchor="middle" font-size="10" fill="#4c1d95">资产优先</text>
  </g>

  <!-- Streaming -->
  <g>
    <rect x="930" y="290" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="990" y="316" text-anchor="middle" font-weight="700" fill="#166534">Flink / Kafka Streams</text>
    <text x="990" y="334" text-anchor="middle" font-size="10" fill="#14532d">事件驱动流式计算</text>
  </g>

  <!-- Labels -->
  <text x="550" y="120" text-anchor="middle" font-size="11" fill="#334155" font-style="italic">
    Airflow 的定位：批处理 + 慢变工作流 + 跨系统协调，不是流式
  </text>
  <text x="550" y="138" text-anchor="middle" font-size="11" fill="#334155">
    （Dag 结构在多次运行间保持相对稳定，run-to-run 一致性是核心假设）
  </text>

  <!-- bottom note -->
  <g transform="translate(60,400)">
    <rect width="980" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="14" y="20" font-size="11" fill="#0f172a" font-weight="600">核心区别</text>
    <text x="14" y="36" font-size="11" fill="#334155">cron 单点调度 ◇ Luigi 去中心 + Task 输出 ◇ <tspan font-weight="700" fill="#1e3a8a">Airflow：中心化 Scheduler、序列化 DAG、Execution API 隔离、Asset 数据驱动</tspan> ◇ Prefect 动态优先 ◇ Dagster Asset-first ◇ Flink 流式 (低延迟事件)</text>
  </g>
</svg>
