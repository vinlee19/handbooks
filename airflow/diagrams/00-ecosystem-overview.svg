<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Apache Airflow 3.x 生态全景</text>
  <text x="600" y="55" text-anchor="middle" font-size="11" fill="#475569">monorepo + uv workspace，30+ 子分发协作组成完整产品</text>

  <!-- ============= USER LAYER ============= -->
  <g>
    <rect x="40" y="80" width="1120" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="60" y="106" font-weight="700" font-size="14" fill="#713f12">用户编写层（Dag Author）</text>

    <rect x="60" y="118" width="200" height="50" rx="6" fill="#ffffff" stroke="#a16207"/>
    <text x="160" y="138" text-anchor="middle" font-weight="700" font-size="12">task-sdk/</text>
    <text x="160" y="156" text-anchor="middle" font-size="10" fill="#713f12">airflow.sdk 命名空间</text>

    <rect x="280" y="118" width="200" height="50" rx="6" fill="#ffffff" stroke="#a16207"/>
    <text x="380" y="138" text-anchor="middle" font-weight="700" font-size="12">DAG 文件 (用户 Python)</text>
    <text x="380" y="156" text-anchor="middle" font-size="10" fill="#713f12">@dag / @task / Asset / DAG()</text>

    <rect x="500" y="118" width="200" height="50" rx="6" fill="#ffffff" stroke="#a16207"/>
    <text x="600" y="138" text-anchor="middle" font-weight="700" font-size="12">DAG Bundle</text>
    <text x="600" y="156" text-anchor="middle" font-size="10" fill="#713f12">local / git / s3 / 自定义</text>

    <rect x="720" y="118" width="200" height="50" rx="6" fill="#ffffff" stroke="#a16207"/>
    <text x="820" y="138" text-anchor="middle" font-weight="700" font-size="12">Plugins</text>
    <text x="820" y="156" text-anchor="middle" font-size="10" fill="#713f12">自定义 Hook / Operator / Macro</text>

    <rect x="940" y="118" width="200" height="50" rx="6" fill="#ffffff" stroke="#a16207"/>
    <text x="1040" y="138" text-anchor="middle" font-weight="700" font-size="12">UI (浏览器)</text>
    <text x="1040" y="156" text-anchor="middle" font-size="10" fill="#713f12">触发 / 查看 / 管理</text>
  </g>

  <!-- ============= CONTROL PLANE ============= -->
  <g>
    <rect x="40" y="200" width="1120" height="140" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="226" font-weight="700" font-size="14" fill="#1e3a8a">控制平面（Control Plane） — 仅这些组件可访问 Metadata DB</text>

    <rect x="60" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="160" y="260" text-anchor="middle" font-weight="700" font-size="12">airflow-core/jobs/</text>
    <text x="160" y="276" text-anchor="middle" font-size="10" fill="#1e40af">SchedulerJobRunner</text>
    <text x="160" y="290" text-anchor="middle" font-size="10" fill="#1e40af">DagProcessorJobRunner</text>
    <text x="160" y="304" text-anchor="middle" font-size="10" fill="#1e40af">TriggererJobRunner</text>
    <text x="160" y="316" text-anchor="middle" font-size="10" fill="#1e40af">Job (心跳基类)</text>

    <rect x="280" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="380" y="260" text-anchor="middle" font-weight="700" font-size="12">dag_processing/</text>
    <text x="380" y="276" text-anchor="middle" font-size="10" fill="#1e40af">manager.py</text>
    <text x="380" y="290" text-anchor="middle" font-size="10" fill="#1e40af">processor.py (subprocess)</text>
    <text x="380" y="304" text-anchor="middle" font-size="10" fill="#1e40af">collection.py</text>
    <text x="380" y="316" text-anchor="middle" font-size="10" fill="#1e40af">bundles/</text>

    <rect x="500" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="600" y="260" text-anchor="middle" font-weight="700" font-size="12">api_fastapi/</text>
    <text x="600" y="276" text-anchor="middle" font-size="10" fill="#1e40af">core_api/ (Public REST)</text>
    <text x="600" y="290" text-anchor="middle" font-size="10" fill="#1e40af">execution_api/ (JWT)</text>
    <text x="600" y="304" text-anchor="middle" font-size="10" fill="#1e40af">Cadwyn 版本控制</text>
    <text x="600" y="316" text-anchor="middle" font-size="10" fill="#1e40af">FastAPI 路由</text>

    <rect x="720" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="820" y="260" text-anchor="middle" font-weight="700" font-size="12">models/</text>
    <text x="820" y="276" text-anchor="middle" font-size="10" fill="#1e40af">DagRun / TaskInstance</text>
    <text x="820" y="290" text-anchor="middle" font-size="10" fill="#1e40af">SerializedDag / Asset</text>
    <text x="820" y="304" text-anchor="middle" font-size="10" fill="#1e40af">Pool / Trigger / Job</text>
    <text x="820" y="316" text-anchor="middle" font-size="10" fill="#1e40af">SQLAlchemy ORM</text>

    <rect x="940" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="1040" y="260" text-anchor="middle" font-weight="700" font-size="12">executors/</text>
    <text x="1040" y="276" text-anchor="middle" font-size="10" fill="#1e40af">BaseExecutor</text>
    <text x="1040" y="290" text-anchor="middle" font-size="10" fill="#1e40af">LocalExecutor</text>
    <text x="1040" y="304" text-anchor="middle" font-size="10" fill="#1e40af">workloads/ ExecuteTask</text>
    <text x="1040" y="316" text-anchor="middle" font-size="10" fill="#1e40af">executor_loader</text>
  </g>

  <!-- ============= EXECUTION PLANE ============= -->
  <g>
    <rect x="40" y="360" width="1120" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="60" y="386" font-weight="700" font-size="14" fill="#14532d">执行平面（Execution Plane） — 不访问 DB，仅通过 Execution API</text>

    <rect x="60" y="400" width="220" height="60" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="170" y="420" text-anchor="middle" font-weight="700" font-size="12">task-sdk execution_time/</text>
    <text x="170" y="436" text-anchor="middle" font-size="10" fill="#166534">supervisor.py (2418 行)</text>
    <text x="170" y="450" text-anchor="middle" font-size="10" fill="#166534">task_runner.py (2184 行)</text>

    <rect x="300" y="400" width="160" height="60" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="380" y="420" text-anchor="middle" font-weight="700" font-size="12">comms.py</text>
    <text x="380" y="436" text-anchor="middle" font-size="10" fill="#166534">msgpack 协议</text>
    <text x="380" y="450" text-anchor="middle" font-size="10" fill="#166534">XCom/Var/Conn 代理</text>

    <rect x="480" y="400" width="200" height="60" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="580" y="420" text-anchor="middle" font-weight="700" font-size="12">Celery Worker / K8s Pod</text>
    <text x="580" y="436" text-anchor="middle" font-size="10" fill="#166534">providers/celery</text>
    <text x="580" y="450" text-anchor="middle" font-size="10" fill="#166534">providers/cncf/kubernetes</text>

    <rect x="700" y="400" width="180" height="60" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="790" y="420" text-anchor="middle" font-weight="700" font-size="12">Triggerer (asyncio)</text>
    <text x="790" y="436" text-anchor="middle" font-size="10" fill="#166534">triggers/base.py</text>
    <text x="790" y="450" text-anchor="middle" font-size="10" fill="#166534">defer / resume</text>

    <rect x="900" y="400" width="240" height="60" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="1020" y="420" text-anchor="middle" font-weight="700" font-size="12">EdgeExecutor 远程 Worker</text>
    <text x="1020" y="436" text-anchor="middle" font-size="10" fill="#166534">providers/edge3</text>
    <text x="1020" y="450" text-anchor="middle" font-size="10" fill="#166534">网络边缘 pull 模型</text>
  </g>

  <!-- ============= SHARED LIBS ============= -->
  <g>
    <rect x="40" y="500" width="1120" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="60" y="526" font-weight="700" font-size="14" fill="#5b21b6">共享库（shared/） — 17 个独立分发，可被多个组件以不同版本依赖</text>
    <g font-size="10" fill="#4c1d95">
      <rect x="60" y="538" width="130" height="48" rx="5" fill="#ffffff" stroke="#a78bfa"/>
      <text x="125" y="555" text-anchor="middle" font-weight="700">configuration</text>
      <text x="125" y="570" text-anchor="middle">airflow.cfg 解析</text>

      <rect x="200" y="538" width="130" height="48" rx="5" fill="#ffffff" stroke="#a78bfa"/>
      <text x="265" y="555" text-anchor="middle" font-weight="700">logging</text>
      <text x="265" y="570" text-anchor="middle">structlog / 远端日志</text>

      <rect x="340" y="538" width="130" height="48" rx="5" fill="#ffffff" stroke="#a78bfa"/>
      <text x="405" y="555" text-anchor="middle" font-weight="700">secrets_masker</text>
      <text x="405" y="570" text-anchor="middle">日志 / 响应脱敏</text>

      <rect x="480" y="538" width="130" height="48" rx="5" fill="#ffffff" stroke="#a78bfa"/>
      <text x="545" y="555" text-anchor="middle" font-weight="700">secrets_backend</text>
      <text x="545" y="570" text-anchor="middle">Vault / AWS SM</text>

      <rect x="620" y="538" width="130" height="48" rx="5" fill="#ffffff" stroke="#a78bfa"/>
      <text x="685" y="555" text-anchor="middle" font-weight="700">serialization</text>
      <text x="685" y="570" text-anchor="middle">XCom / Param JSON</text>

      <rect x="760" y="538" width="130" height="48" rx="5" fill="#ffffff" stroke="#a78bfa"/>
      <text x="825" y="555" text-anchor="middle" font-weight="700">timezones / state</text>
      <text x="825" y="570" text-anchor="middle">时区 / 枚举</text>

      <rect x="900" y="538" width="240" height="48" rx="5" fill="#ffffff" stroke="#a78bfa"/>
      <text x="1020" y="555" text-anchor="middle" font-weight="700">observability / listeners / template_rendering / ...</text>
      <text x="1020" y="570" text-anchor="middle">指标 / Hook / Jinja / OpenTelemetry</text>
    </g>
  </g>

  <!-- ============= PROVIDERS & CLI ============= -->
  <g>
    <rect x="40" y="620" width="1120" height="68" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="60" y="644" font-weight="700" font-size="14" fill="#7f1d1d">扩展层（Extension） — 独立版本发布，按需安装</text>
    <text x="60" y="666" font-size="11" fill="#7f1d1d">providers/ (90+)：amazon · google · slack · snowflake · databricks · celery · kubernetes · edge3 · ...</text>
    <text x="60" y="680" font-size="11" fill="#7f1d1d">airflow-ctl/：管理 CLI；chart/：Helm Chart；docker/：官方镜像；devel-common/：测试夹具</text>
  </g>
</svg>
