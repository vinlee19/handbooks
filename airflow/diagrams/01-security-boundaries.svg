<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">安全边界：谁能访问什么？</text>
  <text x="600" y="54" text-anchor="middle" font-size="11" fill="#475569">基于 security_model.rst 与 Execution API 设计：DB 凭据隔离、JWT 作用域、用户代码沙盒</text>

  <!-- Center: DB -->
  <g>
    <rect x="490" y="290" width="220" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="600" y="316" text-anchor="middle" font-weight="800" fill="#7f1d1d" font-size="14">Metadata DB</text>
    <text x="600" y="334" text-anchor="middle" font-size="11" fill="#991b1b">PostgreSQL / MySQL</text>
    <text x="600" y="352" text-anchor="middle" font-size="11" fill="#991b1b">17 张核心表</text>
    <text x="600" y="372" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">凭据：只下发给</text>
    <text x="600" y="388" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">Scheduler / DFP / API Server</text>
  </g>

  <!-- inner boundary (DB-capable components) -->
  <ellipse cx="600" cy="350" rx="420" ry="200" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="600" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="700">控制平面（可直连 DB）</text>

  <!-- Scheduler -->
  <g>
    <rect x="200" y="170" width="180" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="192" text-anchor="middle" font-weight="700" fill="#1e3a8a">Scheduler</text>
    <text x="290" y="208" text-anchor="middle" font-size="10" fill="#1e40af">完整 DB 读写</text>
    <text x="290" y="222" text-anchor="middle" font-size="10" fill="#1e40af">不 import 用户代码</text>
    <text x="290" y="238" text-anchor="middle" font-size="10" fill="#1e40af">只读 SerializedDag</text>
  </g>

  <!-- DFP -->
  <g>
    <rect x="820" y="170" width="180" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="910" y="192" text-anchor="middle" font-weight="700" fill="#5b21b6">DAG Processor</text>
    <text x="910" y="208" text-anchor="middle" font-size="10" fill="#4c1d95">DB 写：SerializedDag</text>
    <text x="910" y="222" text-anchor="middle" font-size="10" fill="#4c1d95">import 用户代码 (隔离)</text>
    <text x="910" y="238" text-anchor="middle" font-size="10" fill="#4c1d95">每文件子进程</text>
  </g>

  <!-- API Server -->
  <g>
    <rect x="510" y="170" width="180" height="80" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="600" y="192" text-anchor="middle" font-weight="700">API Server</text>
    <text x="600" y="208" text-anchor="middle" font-size="10" fill="#475569">完整 DB 读写</text>
    <text x="600" y="222" text-anchor="middle" font-size="10" fill="#475569">UI / Public API</text>
    <text x="600" y="238" text-anchor="middle" font-size="10" fill="#475569">Execution API JWT 颁发方</text>
  </g>

  <!-- outer boundary (Execution Plane) -->
  <ellipse cx="600" cy="450" rx="560" ry="220" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="600" y="660" text-anchor="middle" font-size="11" fill="#14532d" font-weight="700">执行平面（不可访问 DB，仅 Execution API + JWT）</text>

  <!-- Worker (with sub boundary for user code) -->
  <g>
    <rect x="120" y="450" width="300" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="270" y="472" text-anchor="middle" font-weight="700" fill="#14532d">Worker（双进程隔离）</text>
    <rect x="135" y="484" width="130" height="110" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="200" y="502" text-anchor="middle" font-size="11" font-weight="700">Supervisor</text>
    <text x="200" y="518" text-anchor="middle" font-size="9" fill="#166534">持 JWT</text>
    <text x="200" y="532" text-anchor="middle" font-size="9" fill="#166534">调 Execution API</text>
    <text x="200" y="546" text-anchor="middle" font-size="9" fill="#166534">读 Bundle</text>
    <text x="200" y="562" text-anchor="middle" font-size="9" fill="#166534">写日志</text>
    <text x="200" y="582" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="700">不跑用户代码</text>

    <rect x="280" y="484" width="130" height="110" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="345" y="502" text-anchor="middle" font-size="11" font-weight="700">Task Runner</text>
    <text x="345" y="518" text-anchor="middle" font-size="9" fill="#713f12">import 用户 .py</text>
    <text x="345" y="532" text-anchor="middle" font-size="9" fill="#713f12">执行 operator</text>
    <text x="345" y="546" text-anchor="middle" font-size="9" fill="#713f12">仅 stdin/stdout</text>
    <text x="345" y="562" text-anchor="middle" font-size="9" fill="#713f12">无 JWT</text>
    <text x="345" y="578" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">用户代码沙盒</text>
  </g>

  <!-- Triggerer -->
  <g>
    <rect x="460" y="490" width="280" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="512" text-anchor="middle" font-weight="700" fill="#9a3412">Triggerer</text>
    <text x="600" y="528" text-anchor="middle" font-size="10" fill="#7c2d12">仅经 Execution API</text>
    <text x="600" y="544" text-anchor="middle" font-size="10" fill="#7c2d12">user trigger code 同样在此进程跑</text>
    <text x="600" y="560" text-anchor="middle" font-size="10" fill="#7c2d12">需要把 Trigger 视为半受信任组件</text>
    <text x="600" y="576" text-anchor="middle" font-size="10" fill="#7c2d12">CLAUDE.md 标注为"已知限制"</text>
  </g>

  <!-- UI / End User -->
  <g>
    <rect x="780" y="490" width="280" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="920" y="512" text-anchor="middle" font-weight="700">UI 终端用户</text>
    <text x="920" y="528" text-anchor="middle" font-size="10" fill="#475569">浏览器 → Public REST API</text>
    <text x="920" y="544" text-anchor="middle" font-size="10" fill="#475569">登录后凭 session/JWT</text>
    <text x="920" y="560" text-anchor="middle" font-size="10" fill="#475569">权限受 AuthManager 控制</text>
    <text x="920" y="576" text-anchor="middle" font-size="10" fill="#475569">无法直接写 DB / 跑代码</text>
  </g>

  <!-- DB access lines (DB-capable) -->
  <line x1="290" y1="250" x2="500" y2="300" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrS)"/>
  <line x1="910" y1="250" x2="700" y2="300" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrS)"/>
  <line x1="600" y1="250" x2="600" y2="290" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrS)"/>
  <text x="280" y="278" font-size="10" fill="#dc2626" font-weight="700">DB 凭据</text>
  <text x="860" y="278" font-size="10" fill="#dc2626" font-weight="700">DB 凭据</text>
  <text x="612" y="278" font-size="10" fill="#dc2626" font-weight="700">DB 凭据</text>

  <!-- Execution API arrows from execution plane to API Server -->
  <line x1="200" y1="484" x2="600" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#arrS)"/>
  <line x1="600" y1="490" x2="600" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#arrS)"/>
  <line x1="920" y1="490" x2="600" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#arrS)"/>
  <text x="380" y="350" font-size="10" fill="#16a34a" font-weight="700">JWT (ti:self)</text>
  <text x="650" y="380" font-size="10" fill="#16a34a" font-weight="700">JWT</text>
  <text x="780" y="350" font-size="10" fill="#16a34a" font-weight="700">JWT / Public Auth</text>

  <!-- legend / boxes at top -->
  <g transform="translate(20,80)">
    <rect width="240" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#7f1d1d">红色 = 可访问 DB</text>
    <text x="14" y="38" font-size="10" fill="#991b1b">Scheduler · DFP · API Server</text>
    <text x="14" y="52" font-size="10" fill="#991b1b">凭据通过环境变量 / Secret 注入</text>
  </g>
  <g transform="translate(280,80)">
    <rect width="240" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#14532d">绿色 = 不能访问 DB</text>
    <text x="14" y="38" font-size="10" fill="#166534">Worker · Supervisor · Triggerer</text>
    <text x="14" y="52" font-size="10" fill="#166534">只能调 Execution API + JWT</text>
  </g>
  <g transform="translate(540,80)">
    <rect width="240" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#713f12">黄色 = 用户代码沙盒</text>
    <text x="14" y="38" font-size="10" fill="#854d0e">Task Runner 进程</text>
    <text x="14" y="52" font-size="10" fill="#854d0e">无任何凭据，仅 stdin/stdout</text>
  </g>
  <g transform="translate(800,80)">
    <rect width="240" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="14" y="20" font-size="11" font-weight="700">灰色 = 受 AuthManager 管理</text>
    <text x="14" y="38" font-size="10" fill="#475569">UI 用户、外部客户端</text>
    <text x="14" y="52" font-size="10" fill="#475569">RBAC / SSO</text>
  </g>
</svg>
