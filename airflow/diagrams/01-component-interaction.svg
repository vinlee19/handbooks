<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">
  <defs>
    <marker id="arrI" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrIg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrIp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">组件交互图：从一行 Python 到 task 完成</text>
  <text x="600" y="54" text-anchor="middle" font-size="11" fill="#475569">9 大架构边界对应的真实调用关系</text>

  <!-- USER -->
  <g>
    <rect x="40" y="90" width="200" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="140" y="114" text-anchor="middle" font-weight="700" fill="#713f12">DAG Author</text>
    <text x="140" y="132" text-anchor="middle" font-size="10" fill="#854d0e">写 Python，提交到 Bundle</text>
  </g>

  <!-- Bundle source -->
  <g>
    <rect x="280" y="90" width="200" height="60" rx="8" fill="#fef9c3" stroke="#a16207"/>
    <text x="380" y="114" text-anchor="middle" font-weight="700" fill="#713f12">Bundle Source</text>
    <text x="380" y="132" text-anchor="middle" font-size="10" fill="#854d0e">Git / S3 / 本地路径</text>
  </g>

  <!-- DFP -->
  <g>
    <rect x="520" y="90" width="220" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="630" y="114" text-anchor="middle" font-weight="700" fill="#5b21b6">DAG Processor</text>
    <text x="630" y="132" text-anchor="middle" font-size="10" fill="#4c1d95">Manager + 子进程池</text>
    <text x="630" y="148" text-anchor="middle" font-size="10" fill="#4c1d95">解析 → 校验 → 序列化</text>
    <text x="630" y="164" text-anchor="middle" font-size="10" fill="#4c1d95">捕捉 import_error</text>
    <text x="630" y="180" text-anchor="middle" font-size="10" fill="#4c1d95">提取回调请求</text>
  </g>

  <!-- DB -->
  <g>
    <rect x="800" y="90" width="240" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="920" y="114" text-anchor="middle" font-weight="700" fill="#991b1b">Metadata DB</text>
    <text x="920" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d">serialized_dag / dag</text>
    <text x="920" y="148" text-anchor="middle" font-size="10" fill="#7f1d1d">dag_run / task_instance</text>
    <text x="920" y="164" text-anchor="middle" font-size="10" fill="#7f1d1d">asset_event / pool / job</text>
    <text x="920" y="180" text-anchor="middle" font-size="10" fill="#7f1d1d">trigger / connection</text>
  </g>

  <!-- Scheduler -->
  <g>
    <rect x="40" y="240" width="260" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="170" y="262" text-anchor="middle" font-weight="700" fill="#1e3a8a">Scheduler</text>
    <text x="170" y="280" text-anchor="middle" font-size="10" fill="#1e40af">读 SerializedDag, 不执行用户代码</text>
    <text x="170" y="298" text-anchor="middle" font-size="10" fill="#1e40af">_create_dag_runs()</text>
    <text x="170" y="314" text-anchor="middle" font-size="10" fill="#1e40af">_executable_task_instances_to_queued()</text>
    <text x="170" y="330" text-anchor="middle" font-size="10" fill="#1e40af">FOR UPDATE SKIP LOCKED · Pool slot</text>
  </g>

  <!-- Executor -->
  <g>
    <rect x="340" y="240" width="220" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="450" y="262" text-anchor="middle" font-weight="700" fill="#1e3a8a">Executor</text>
    <text x="450" y="280" text-anchor="middle" font-size="10" fill="#1e40af">BaseExecutor.queue_task()</text>
    <text x="450" y="296" text-anchor="middle" font-size="10" fill="#1e40af">LocalExecutor / Celery / K8s</text>
    <text x="450" y="312" text-anchor="middle" font-size="10" fill="#1e40af">event_buffer 反馈</text>
    <text x="450" y="328" text-anchor="middle" font-size="10" fill="#1e40af">Workload: ExecuteTask</text>
  </g>

  <!-- API Server -->
  <g>
    <rect x="600" y="240" width="220" height="100" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="710" y="262" text-anchor="middle" font-weight="700">API Server (FastAPI)</text>
    <text x="710" y="278" text-anchor="middle" font-size="10" fill="#475569">core_api/ (UI / 外部)</text>
    <text x="710" y="294" text-anchor="middle" font-size="10" fill="#475569">execution_api/ (worker)</text>
    <text x="710" y="310" text-anchor="middle" font-size="10" fill="#475569">JWT (ti:self, 自动续期)</text>
    <text x="710" y="326" text-anchor="middle" font-size="10" fill="#475569">Cadwyn 版本</text>
  </g>

  <!-- UI -->
  <g>
    <rect x="860" y="240" width="220" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="970" y="262" text-anchor="middle" font-weight="700">UI (React 19)</text>
    <text x="970" y="278" text-anchor="middle" font-size="10" fill="#475569">Vite + Chakra + TanStack</text>
    <text x="970" y="294" text-anchor="middle" font-size="10" fill="#475569">openapi-react-query-codegen</text>
    <text x="970" y="310" text-anchor="middle" font-size="10" fill="#475569">DAG / Run / TI 可视化</text>
    <text x="970" y="326" text-anchor="middle" font-size="10" fill="#475569">手动触发 / Backfill</text>
  </g>

  <!-- Triggerer -->
  <g>
    <rect x="40" y="400" width="260" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="170" y="422" text-anchor="middle" font-weight="700" fill="#9a3412">Triggerer</text>
    <text x="170" y="438" text-anchor="middle" font-size="10" fill="#7c2d12">asyncio + greenback + anyio</text>
    <text x="170" y="454" text-anchor="middle" font-size="10" fill="#7c2d12">BaseTrigger.run() async iter</text>
    <text x="170" y="470" text-anchor="middle" font-size="10" fill="#7c2d12">事件 → 唤醒 TI</text>
    <text x="170" y="486" text-anchor="middle" font-size="10" fill="#7c2d12">单进程并发数百~数千 Trigger</text>
  </g>

  <!-- Worker (Supervisor + TaskRunner) -->
  <g>
    <rect x="340" y="400" width="480" height="180" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="422" text-anchor="middle" font-weight="700" fill="#14532d">Worker（双进程） · Celery/K8s/Local</text>

    <rect x="360" y="436" width="220" height="130" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="470" y="456" text-anchor="middle" font-weight="700" fill="#14532d">Supervisor</text>
    <text x="470" y="474" text-anchor="middle" font-size="10" fill="#166534">execution_time/supervisor.py</text>
    <text x="470" y="490" text-anchor="middle" font-size="10" fill="#166534">持 JWT · 调 Execution API</text>
    <text x="470" y="506" text-anchor="middle" font-size="10" fill="#166534">代理 XCom / Var / Conn</text>
    <text x="470" y="522" text-anchor="middle" font-size="10" fill="#166534">heartbeat / 日志聚合</text>
    <text x="470" y="540" text-anchor="middle" font-size="10" fill="#166534">读 Bundle</text>
    <text x="470" y="556" text-anchor="middle" font-size="10" fill="#166534" font-style="italic">不跑用户代码</text>

    <rect x="600" y="436" width="200" height="130" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="700" y="456" text-anchor="middle" font-weight="700" fill="#713f12">Task Runner</text>
    <text x="700" y="474" text-anchor="middle" font-size="10" fill="#854d0e">execution_time/task_runner.py</text>
    <text x="700" y="490" text-anchor="middle" font-size="10" fill="#854d0e">import 用户 DAG / Operator</text>
    <text x="700" y="506" text-anchor="middle" font-size="10" fill="#854d0e">执行 operator.execute()</text>
    <text x="700" y="522" text-anchor="middle" font-size="10" fill="#854d0e">通过 msgpack 与 Supervisor 通信</text>
    <text x="700" y="538" text-anchor="middle" font-size="10" fill="#854d0e">无 JWT · 无 DB 凭据</text>
    <text x="700" y="556" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">用户代码沙盒</text>
  </g>

  <!-- Provider plugins -->
  <g>
    <rect x="860" y="400" width="220" height="100" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="970" y="422" text-anchor="middle" font-weight="700" fill="#7f1d1d">Provider (按需安装)</text>
    <text x="970" y="438" text-anchor="middle" font-size="10" fill="#991b1b">Amazon / Google / Slack ...</text>
    <text x="970" y="454" text-anchor="middle" font-size="10" fill="#991b1b">Hook + Operator + Sensor</text>
    <text x="970" y="470" text-anchor="middle" font-size="10" fill="#991b1b">setuptools entry_points</text>
    <text x="970" y="486" text-anchor="middle" font-size="10" fill="#991b1b">运行时由 ProvidersManager 发现</text>
  </g>

  <!-- Arrows -->
  <!-- User → Bundle -->
  <line x1="240" y1="120" x2="280" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#arrI)"/>
  <text x="240" y="110" font-size="10" fill="#334155">git push</text>
  <!-- Bundle → DFP -->
  <line x1="480" y1="120" x2="520" y2="120" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrIp)"/>
  <!-- DFP → DB -->
  <line x1="740" y1="140" x2="800" y2="140" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrIp)"/>
  <text x="744" y="132" font-size="10" fill="#5b21b6">SerializedDagModel</text>

  <!-- Scheduler ↔ DB -->
  <line x1="290" y1="265" x2="800" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrI)"/>
  <text x="450" y="220" font-size="10" fill="#1e3a8a">read SerializedDag, write TI</text>
  <line x1="800" y1="200" x2="290" y2="280" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Scheduler → Executor -->
  <line x1="300" y1="290" x2="340" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#arrI)"/>
  <text x="304" y="284" font-size="10" fill="#334155">queue_task(ExecuteTask)</text>
  <!-- Executor → Worker (Supervisor) -->
  <line x1="450" y1="340" x2="450" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrI)"/>
  <text x="455" y="380" font-size="10" fill="#334155">运行 Workload</text>
  <!-- Executor event_buffer ← Worker -->
  <line x1="500" y1="400" x2="520" y2="340" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="520" y="370" font-size="9" fill="#475569">event</text>

  <!-- Supervisor → API Server -->
  <line x1="470" y1="436" x2="700" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arrIg)"/>
  <text x="500" y="380" font-size="10" fill="#16a34a" font-weight="700">Execution API + JWT</text>
  <!-- Triggerer → API Server -->
  <line x1="300" y1="450" x2="700" y2="340" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrIg)"/>
  <text x="380" y="430" font-size="10" fill="#16a34a">Trigger 事件</text>
  <!-- API Server → DB -->
  <line x1="820" y1="265" x2="800" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrI)"/>
  <text x="828" y="216" font-size="10" fill="#475569">SQLAlchemy</text>
  <!-- UI → API Server -->
  <line x1="860" y1="290" x2="820" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#arrI)"/>
  <text x="828" y="284" font-size="10" fill="#334155">REST</text>

  <!-- Provider in worker -->
  <line x1="820" y1="450" x2="860" y2="450" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrI)"/>
  <text x="828" y="442" font-size="10" fill="#7f1d1d">runtime import</text>

  <!-- Bottom labels -->
  <g transform="translate(40,620)">
    <rect width="1120" height="120" rx="10" fill="#ecfeff" stroke="#0891b2"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#155e75">9 大架构边界对应到本图</text>
    <text x="14" y="42" font-size="11" fill="#164e63">1. 作者用 Task SDK 写 Dag → 推到 Bundle  　　2. DFP 在独立进程解析 → 写 SerializedDagModel  　　3. Scheduler 只读序列化 Dag → 不执行用户代码</text>
    <text x="14" y="60" font-size="11" fill="#164e63">4. Worker 通过 Task SDK + Execution API 通信 → 不直连 DB  　　5. API Server 服务 UI + 直连 DB  　　6. Triggerer 在独立进程跑 asyncio → 仅经 Execution API</text>
    <text x="14" y="78" font-size="11" fill="#164e63">7. 共享库（shared/）符号链接进多个分发  　　8. uv workspace 统一管理多个分发依赖  　　9. 每个分发只声明自己直接需要的其他分发</text>
    <text x="14" y="100" font-size="11" fill="#164e63" font-style="italic">蓝色 = 控制平面 · 紫色 = 解析平面 · 绿色 = 执行平面 · 橙色 = 异步平面 · 红色 = 数据/扩展层 · 灰色 = 接入层</text>
  </g>
</svg>
