<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">主要 AIP（Airflow Improvement Proposal）时间线</text>
  <text x="600" y="55" text-anchor="middle" font-size="11" fill="#475569">从 2.0 至 3.x：驱动 Airflow 架构升级的核心提案</text>

  <!-- timeline backbone -->
  <line x1="80" y1="270" x2="1140" y2="270" stroke="#94a3b8" stroke-width="3"/>
  <line x1="80" y1="270" x2="1140" y2="270" stroke="#cbd5e1" stroke-dasharray="2 4"/>

  <!-- year markers -->
  <g font-size="11" fill="#64748b">
    <line x1="120" y1="265" x2="120" y2="275" stroke="#64748b"/><text x="120" y="294" text-anchor="middle">2020</text>
    <line x1="290" y1="265" x2="290" y2="275" stroke="#64748b"/><text x="290" y="294" text-anchor="middle">2021</text>
    <line x1="460" y1="265" x2="460" y2="275" stroke="#64748b"/><text x="460" y="294" text-anchor="middle">2022</text>
    <line x1="630" y1="265" x2="630" y2="275" stroke="#64748b"/><text x="630" y="294" text-anchor="middle">2023</text>
    <line x1="800" y1="265" x2="800" y2="275" stroke="#64748b"/><text x="800" y="294" text-anchor="middle">2024</text>
    <line x1="970" y1="265" x2="970" y2="275" stroke="#64748b"/><text x="970" y="294" text-anchor="middle">2025</text>
    <line x1="1110" y1="265" x2="1110" y2="275" stroke="#64748b"/><text x="1110" y="294" text-anchor="middle">2026+</text>
  </g>

  <!-- AIPs above the line -->
  <!-- AIP-31 TaskFlow (2.0 ~2020) -->
  <g>
    <line x1="140" y1="270" x2="140" y2="200" stroke="#94a3b8"/>
    <circle cx="140" cy="270" r="5" fill="#2563eb"/>
    <rect x="80" y="140" width="140" height="60" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="150" y="160" text-anchor="middle" font-weight="700" font-size="12" fill="#1e3a8a">AIP-31</text>
    <text x="150" y="176" text-anchor="middle" font-size="10" fill="#1e40af">TaskFlow API</text>
    <text x="150" y="190" text-anchor="middle" font-size="10" fill="#1e40af">@task 装饰器</text>
  </g>

  <!-- AIP-39 logical date (2.2 ~2021) -->
  <g>
    <line x1="305" y1="270" x2="305" y2="200" stroke="#94a3b8"/>
    <circle cx="305" cy="270" r="5" fill="#2563eb"/>
    <rect x="245" y="140" width="140" height="60" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="315" y="160" text-anchor="middle" font-weight="700" font-size="12" fill="#1e3a8a">AIP-39</text>
    <text x="315" y="176" text-anchor="middle" font-size="10" fill="#1e40af">Logical Date</text>
    <text x="315" y="190" text-anchor="middle" font-size="10" fill="#1e40af">替换 execution_date 语义</text>
  </g>

  <!-- AIP-48 Deferrable (2.2 ~2021) -->
  <g>
    <line x1="350" y1="270" x2="350" y2="370" stroke="#94a3b8"/>
    <circle cx="350" cy="270" r="5" fill="#ea580c"/>
    <rect x="290" y="370" width="140" height="60" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="360" y="390" text-anchor="middle" font-weight="700" font-size="12" fill="#9a3412">AIP-48</text>
    <text x="360" y="406" text-anchor="middle" font-size="10" fill="#7c2d12">Deferrable Operators</text>
    <text x="360" y="420" text-anchor="middle" font-size="10" fill="#7c2d12">Triggerer 进程引入</text>
  </g>

  <!-- AIP-43 DAG Processor (2.3+ ~2022) -->
  <g>
    <line x1="490" y1="270" x2="490" y2="200" stroke="#94a3b8"/>
    <circle cx="490" cy="270" r="5" fill="#7c3aed"/>
    <rect x="430" y="140" width="140" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="500" y="160" text-anchor="middle" font-weight="700" font-size="12" fill="#5b21b6">AIP-43</text>
    <text x="500" y="176" text-anchor="middle" font-size="10" fill="#4c1d95">DAG Processor 独立</text>
    <text x="500" y="190" text-anchor="middle" font-size="10" fill="#4c1d95">隔离用户代码</text>
  </g>

  <!-- AIP-60 Asset/Dataset (2.4) -->
  <g>
    <line x1="530" y1="270" x2="530" y2="370" stroke="#94a3b8"/>
    <circle cx="530" cy="270" r="5" fill="#16a34a"/>
    <rect x="470" y="370" width="140" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="540" y="390" text-anchor="middle" font-weight="700" font-size="12" fill="#14532d">AIP-60</text>
    <text x="540" y="406" text-anchor="middle" font-size="10" fill="#166534">Dataset → Asset</text>
    <text x="540" y="420" text-anchor="middle" font-size="10" fill="#166534">数据驱动调度雏形</text>
  </g>

  <!-- AIP-44 internal API (2.5 ~2023) -->
  <g>
    <line x1="670" y1="270" x2="670" y2="200" stroke="#94a3b8"/>
    <circle cx="670" cy="270" r="5" fill="#475569"/>
    <rect x="610" y="140" width="140" height="60" rx="6" fill="#e2e8f0" stroke="#475569"/>
    <text x="680" y="160" text-anchor="middle" font-weight="700" font-size="12" fill="#1f2937">AIP-44</text>
    <text x="680" y="176" text-anchor="middle" font-size="10" fill="#334155">Internal API (草案)</text>
    <text x="680" y="190" text-anchor="middle" font-size="10" fill="#334155">→ 演化为 AIP-72</text>
  </g>

  <!-- AIP-66 DAG Bundle (2.10) -->
  <g>
    <line x1="710" y1="270" x2="710" y2="370" stroke="#94a3b8"/>
    <circle cx="710" cy="270" r="5" fill="#7c3aed"/>
    <rect x="650" y="370" width="140" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="720" y="390" text-anchor="middle" font-weight="700" font-size="12" fill="#5b21b6">AIP-66</text>
    <text x="720" y="406" text-anchor="middle" font-size="10" fill="#4c1d95">DAG Bundle 抽象</text>
    <text x="720" y="420" text-anchor="middle" font-size="10" fill="#4c1d95">git/local/s3</text>
  </g>

  <!-- AIP-72 Task SDK (3.0) -->
  <g>
    <line x1="850" y1="270" x2="850" y2="200" stroke="#94a3b8"/>
    <circle cx="850" cy="270" r="6" fill="#dc2626"/>
    <rect x="790" y="120" width="140" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="860" y="140" text-anchor="middle" font-weight="700" font-size="12" fill="#7f1d1d">AIP-72</text>
    <text x="860" y="158" text-anchor="middle" font-size="10" fill="#991b1b">Task SDK</text>
    <text x="860" y="172" text-anchor="middle" font-size="10" fill="#991b1b">airflow.sdk 命名空间</text>
    <text x="860" y="186" text-anchor="middle" font-size="10" fill="#991b1b">Worker 不连 DB</text>
  </g>

  <!-- AIP-67 Multi-Team (3.x) -->
  <g>
    <line x1="890" y1="270" x2="890" y2="370" stroke="#94a3b8"/>
    <circle cx="890" cy="270" r="5" fill="#0891b2"/>
    <rect x="830" y="370" width="140" height="60" rx="6" fill="#ecfeff" stroke="#0891b2"/>
    <text x="900" y="390" text-anchor="middle" font-weight="700" font-size="12" fill="#155e75">AIP-67</text>
    <text x="900" y="406" text-anchor="middle" font-size="10" fill="#164e63">Multi-Team</text>
    <text x="900" y="420" text-anchor="middle" font-size="10" fill="#164e63">资源隔离 / Bundle 团队归属</text>
  </g>

  <!-- AIP-79 Modular UI (3.x) -->
  <g>
    <line x1="990" y1="270" x2="990" y2="200" stroke="#94a3b8"/>
    <circle cx="990" cy="270" r="5" fill="#475569"/>
    <rect x="930" y="140" width="140" height="60" rx="6" fill="#e2e8f0" stroke="#475569"/>
    <text x="1000" y="160" text-anchor="middle" font-weight="700" font-size="12" fill="#1f2937">AIP-79</text>
    <text x="1000" y="176" text-anchor="middle" font-size="10" fill="#334155">移除 FAB 核心依赖</text>
    <text x="1000" y="190" text-anchor="middle" font-size="10" fill="#334155">React 19 + FastAPI</text>
  </g>

  <!-- AIP-76 Asset Partition (3.x) -->
  <g>
    <line x1="1030" y1="270" x2="1030" y2="370" stroke="#94a3b8"/>
    <circle cx="1030" cy="270" r="5" fill="#16a34a"/>
    <rect x="970" y="370" width="140" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1040" y="390" text-anchor="middle" font-weight="700" font-size="12" fill="#14532d">AIP-76</text>
    <text x="1040" y="406" text-anchor="middle" font-size="10" fill="#166534">Asset Partitioning</text>
    <text x="1040" y="420" text-anchor="middle" font-size="10" fill="#166534">运行时分区键 / mapper</text>
  </g>

  <!-- AIP-99 Agentic & AIP-103 State Backend (future) -->
  <g>
    <line x1="1110" y1="270" x2="1110" y2="200" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <circle cx="1110" cy="270" r="5" fill="#a16207" stroke="#a16207"/>
    <rect x="1050" y="120" width="140" height="80" rx="6" fill="#fef9c3" stroke="#a16207"/>
    <text x="1120" y="140" text-anchor="middle" font-weight="700" font-size="12" fill="#713f12">AIP-99 / 103</text>
    <text x="1120" y="158" text-anchor="middle" font-size="10" fill="#854d0e">Agentic Workflow</text>
    <text x="1120" y="172" text-anchor="middle" font-size="10" fill="#854d0e">Task State Backend</text>
    <text x="1120" y="186" text-anchor="middle" font-size="10" fill="#854d0e">(进行中)</text>
  </g>

  <!-- versions below year markers -->
  <g font-size="10" fill="#0f172a" font-weight="700">
    <text x="120" y="466" text-anchor="middle">v2.0</text>
    <text x="290" y="466" text-anchor="middle">v2.2</text>
    <text x="460" y="466" text-anchor="middle">v2.3 ~ v2.5</text>
    <text x="630" y="466" text-anchor="middle">v2.6 ~ v2.8</text>
    <text x="800" y="466" text-anchor="middle">v2.9 ~ v2.10</text>
    <text x="970" y="466" text-anchor="middle">v3.0 ~ v3.2</text>
    <text x="1110" y="466" text-anchor="middle">v3.3+ (main)</text>
  </g>

  <!-- legend -->
  <g transform="translate(80,486)">
    <text x="0" y="14" font-size="11" font-weight="700" fill="#0f172a">图例：</text>
    <circle cx="60" cy="10" r="4" fill="#2563eb"/><text x="70" y="14" font-size="10" fill="#1e3a8a">作者面 / 调度</text>
    <circle cx="180" cy="10" r="4" fill="#7c3aed"/><text x="190" y="14" font-size="10" fill="#5b21b6">DAG 处理 / Bundle</text>
    <circle cx="310" cy="10" r="4" fill="#16a34a"/><text x="320" y="14" font-size="10" fill="#14532d">Asset</text>
    <circle cx="380" cy="10" r="4" fill="#ea580c"/><text x="390" y="14" font-size="10" fill="#9a3412">Deferrable</text>
    <circle cx="470" cy="10" r="4" fill="#dc2626"/><text x="480" y="14" font-size="10" fill="#7f1d1d">SDK / Execution API</text>
    <circle cx="610" cy="10" r="4" fill="#0891b2"/><text x="620" y="14" font-size="10" fill="#155e75">Multi-Team</text>
    <circle cx="710" cy="10" r="4" fill="#a16207"/><text x="720" y="14" font-size="10" fill="#713f12">未来</text>
  </g>
</svg>
